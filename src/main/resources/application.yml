spring:
  application:
    name: ink-ms-sports

  datasource:
    url: jdbc:mysql://localhost:3306/sports_events_ms?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

server:
  port: 3003

jwt:
  secret: ${JWT_SECRET:inklusport2024superSecretKeyForJWTtokenGenerationWith512bitsAlgorithmHS512}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.inklusport.sports: DEBUG

users:
  service:
    url: http://localhost:3002

subscriptions:
  service:
    url: ${SUBSCRIPTIONS_SERVICE_URL:http://localhost:3005}

accessibility:
  service:
    url: http://localhost:3004

# Dueño del modo competencia (RF53): se consulta antes de registrar asistencia.
ai:
  service:
    url: ${AI_SERVICE_URL:http://localhost:3008}

notifications:
  admin-emails: ${NOTIFICATION_ADMIN_EMAILS:}