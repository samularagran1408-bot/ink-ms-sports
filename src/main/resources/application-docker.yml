spring:
  application:
    name: ink-ms-sports
  
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/sports_events_ms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format-sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 3003

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:3001}

security:
  basic:
    enabled: false

users:
  service:
    url: ${USERS_SERVICE_URL:http://users-service:3002}

accessibility:
  service:
    url: ${ACCESSIBILITY_SERVICE_URL:http://accessibility-service:3004}

notifications:
  admin-emails: ${NOTIFICATION_ADMIN_EMAILS:}

logging:
  level:
    com.inklusport.sports: ${LOG_LEVEL:DEBUG}